# After Hours Burger — single-VPS deployment (spec §15).
# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: after-hours

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afterhours}
      POSTGRES_USER: ${POSTGRES_USER:-afterhours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging: *logging

  # One-shot, controlled schema migration. The game service starts only after it succeeds.
  migrate:
    image: after-hours-game:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    command: ["node", "apps/server/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-afterhours}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-afterhours}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    logging: *logging

  game:
    image: after-hours-game:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "2567"
      DATABASE_URL: postgres://${POSTGRES_USER:-afterhours}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-afterhours}
      GUEST_TOKEN_SECRET: ${GUEST_TOKEN_SECRET:?set GUEST_TOKEN_SECRET in deploy/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in deploy/.env}
      MAX_ROOMS: ${MAX_ROOMS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "1"
    # Loopback only: host Nginx (or your panel's web server) is the public entry point.
    ports:
      - "127.0.0.1:${GAME_PORT:-2567}:2567"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [backend, edge]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }
    logging: *logging

volumes:
  pgdata:

networks:
  # The database is reachable only on this private network.
  backend:
    internal: true
  edge: {}
