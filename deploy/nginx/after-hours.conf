# After Hours Burger — example Nginx sites for an existing host Nginx (spec §15, Appendix B).
# Replace game.example.com / realtime.example.com, certificate paths and the client directory.
#
# Put this map once in the http {} context (e.g. /etc/nginx/conf.d/websocket-map.conf) if your
# Nginx does not already define it:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# The realtime host logs without query strings: the WebSocket URL carries the guest credential.
log_format ahb_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com realtime.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

    root /var/www/after-hours/client;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HTML always revalidates so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fingerprinted build output can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Real 404s for missing files (no SPA fallback that would hide missing assets).
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name realtime.example.com;

    ssl_certificate     /etc/letsencrypt/live/realtime.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realtime.example.com/privkey.pem;

    access_log /var/log/nginx/after-hours-realtime.access.log ahb_noquery;
    client_max_body_size 32k;

    # Every path (matchmaking, /api, /healthz and per-room WebSocket paths) goes to the game.
    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
